---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for go.mod
        if: github.event.pull_request.draft != true
        id: manifest
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Go steps skipped: no go.mod yet"
          fi

      - name: Setup Go
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          # Left to the two steps below. setup-go's own cache covers the module
          # cache and the build cache under one key that carries no job name, so
          # every job in the repository shares one entry: the first job to
          # finish writes it, and every later job restores whatever that job
          # happened to build. A job running `go test -race` then starts from
          # objects compiled without the race detector and rebuilds them all.
          cache: false

      # A cache key joins the runner, the go.sum hash and, for the build cache,
      # the commit, and runs past 80 columns, so yamllint's line-length rule is
      # off for the two cache steps alone.
      # yamllint disable rule:line-length
      - name: Restore Go module cache
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      # The commit SHA in the key is deliberate. Without it the key is stable,
      # the restore is an exact hit, and actions/cache skips the save -- so the
      # entry freezes at the first build and no later run can improve it. With
      # it every run misses, restores the newest prefix match, and saves what it
      # actually built. `test` names this job's build cache; give every job in
      # the repository a different name here.
      - name: Restore Go build cache
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-test-
      # yamllint enable rule:line-length

      - name: Install praetorctl at the engine pin
        # PRAETOR_REF is the repository's one engine pin: the git hooks read it
        # from here (.config/lefthook/engine.sh) and run the same engine CI
        # installs. A full commit id only, never a branch or a tag. The
        # version check fails the step when the binary is not that commit.
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        env:
          PRAETOR_REF: 784c42f5aff539806619ae8858afcc468f1e3e3a
        run: |
          set -euo pipefail
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          ln -s "$(go env GOPATH)/bin/standardsctl" "$(go env GOPATH)/bin/praetorctl"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/praetorctl" version | grep -Fx "praetorctl version ${PRAETOR_REF:0:12}"

      - name: Audit the Praetor-managed files (praetorctl audit --offline)
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: praetorctl audit --offline

      - name: Vet
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: go vet ./...

      - name: Test
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: go test -race ./...

name: release-check

# Builds a snapshot release with the SBOM documents whenever the release
# configuration changes, so a broken .goreleaser.yaml fails here and not on a
# tag push. Signing and publishing need the tag run's OIDC token and are
# skipped; release.yml does both.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - .github/workflows/release-check.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 16
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout
        if: github.event.pull_request.draft != true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        if: github.event.pull_request.draft != true
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # See ci.yml: explicit restores keep other refs from saving.
          cache: false

      # Runner and input hashes make cache keys exceed 80 columns.
      # yamllint disable rule:line-length
      - name: Restore Go module cache
        if: github.event.pull_request.draft != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-
      # yamllint enable rule:line-length
      - name: Set up Node.js
        if: github.event.pull_request.draft != true
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          # Explicit restores avoid automatic npm cache writes on release refs.
          package-manager-cache: false

      # yamllint disable rule:line-length
      - name: Restore npm cache
        if: github.event.pull_request.draft != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-
      # yamllint enable rule:line-length
      - name: Build UI
        if: github.event.pull_request.draft != true
        run: |
          make ui
      - name: Install Syft
        if: github.event.pull_request.draft != true
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Build the snapshot
        if: github.event.pull_request.draft != true
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 #7.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,publish
      - name: Every archive has both SBOM documents
        if: github.event.pull_request.draft != true
        run: |
          set -euo pipefail
          n=0
          for a in dist/*.tar.gz dist/*.zip; do
            [ -e "$a" ] || continue
            for d in "$a.cyclonedx.json" "$a.spdx.json"; do
              jq -e . "$d" > /dev/null || { echo "::error::missing or invalid $d"; exit 1; }
            done
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no archives in dist"; exit 1; }
          echo "$n archives, each with a CycloneDX and an SPDX document"

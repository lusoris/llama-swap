---
name: Secret Scan

'on':
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
  # No paths filter: a secret can land in any file.
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-26.04
    steps:
      # gitleaks scans every commit, so it needs the full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      # Versions are pinned in .github/tools/go.mod; binaries go to the
      # git-ignored .github/tools/bin, never the shared ~/go/bin.
      - name: Install gitleaks
        run: |
          GOBIN="$GITHUB_WORKSPACE/.github/tools/bin" go -C .github/tools install github.com/zricethezav/gitleaks/v8
          echo "$GITHUB_WORKSPACE/.github/tools/bin" >> "$GITHUB_PATH"
      # Findings that are not secrets are listed with a reason in
      # .gitleaksignore; any other finding fails the job.
      - name: Run gitleaks
        run: gitleaks git --no-banner --redact --exit-code 1 .

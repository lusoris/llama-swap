name: goreleaser

on:
  push:
    tags:
      - "*"

  # Allows manual triggering of the workflow
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag version to release (e.g. v144)"
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # upload the release assets
      contents: write
      # keyless cosign signature of the checksums file (.goreleaser.yaml signs)
      id-token: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      tag: ${{ steps.hashes.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #6.4.0
        with:
          go-version-file: go.mod
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          # print lines after "## <tag>" or "## <tag> (Jan 2, 2026)" up to
          # the next "## " heading
          awk -v tag="## ${TAG}" '
            $0 == tag || index($0, tag " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${NOTES}"

          if ! grep -q '[^[:space:]]' "${NOTES}"; then
            echo "::error::no CHANGELOG.md entry for ${TAG}, run make release to generate it"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
        with:
          node-version: "24"
      - name: Build UI
        run: |
          make ui

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 #7.2.1
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The SLSA generator signs provenance over these digests: every line of
      # the checksums file, so each archive and each SBOM document is a subject.
      - name: Collect the release digests
        id: hashes
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          checksums=$(jq -r '.[] | select(.type == "Checksum") | .path' <<< "${ARTIFACTS}")
          echo "hashes=$(base64 -w0 < "${checksums}")" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: goreleaser
    permissions:
      # read the workflow run the provenance describes
      actions: read
      # sign the provenance keyless
      id-token: write
      # attach the provenance to the release
      contents: write
    # SLSA Build Level 3: the generator signs in its own reusable workflow.
    # slsa-verifier accepts its provenance only when it is called by a tag.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.goreleaser.outputs.tag }}

  trigger-tap-update:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: "Resolve tag to dispatch"
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Trigger tap repository update"
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 #4.0.1
        with:
          token: ${{ secrets.TAP_REPO_PAT }}
          repository: mostlygeek/homebrew-llama-swap
          event-type: new-release
          client-payload: |
            {
              "release": {
                "tag_name": "${{ steps.tag.outputs.tag }}"
              }
            }

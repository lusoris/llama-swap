name: Linux CI

on:
  push:
    branches: ["main"]
    # only run when backend source changes
    # cmd/ is excluded because it contains utilities without tests;
    # cmd/kubeswap is re-included: it has test suites (make test-cmd)
    # and the Helm chart (make test-chart)
    paths:
      - "**/*.go"
      - "!cmd/**"
      - "cmd/kubeswap/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/go-ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "!cmd/**"
      - "cmd/kubeswap/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/go-ci.yml"

  # Allows manual triggering of the workflow
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # See ci.yml: explicit restores keep other refs from saving.
          cache: false

      # Runner and input hashes make cache keys exceed 80 columns.
      # yamllint disable rule:line-length
      - name: Restore Go module cache
        id: restore-gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-
      # yamllint enable rule:line-length

      # This job uses the same go test -race flags as ci.yml's test job.
      # Restore its build cache without saving; ci.yml owns the entry.
      # yamllint disable rule:line-length
      - name: Restore Go build cache
        id: restore-gobuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-test-
      # yamllint enable rule:line-length

      # Only run in this linux based runner
      - name: Check Formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            gofmt -l .
            exit 1
          fi
      # cache simple-responder to save the build time
      # yamllint disable rule:line-length
      - name: Restore Simple Responder
        id: restore-simple-responder
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./build
          key: ${{ runner.os }}-simple-responder-${{ hashFiles('cmd/simple-responder/simple-responder.go') }}
      # yamllint enable rule:line-length

      # necessary for testing proxy/Process swapping
      - name: Create simple-responder
        if: steps.restore-simple-responder.outputs.cache-hit != 'true'
        run: make simple-responder

      # yamllint disable rule:line-length
      - name: Save Simple Responder
        # Only main saves; pull-request entries evict caches main can use.
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.restore-simple-responder.outputs.cache-hit != 'true'
        id: save-simple-responder
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./build
          key: ${{ runner.os }}-simple-responder-${{ hashFiles('cmd/simple-responder/simple-responder.go') }}
      # yamllint enable rule:line-length

      - name: Test all
        run: make test-all

      # The cmd utility suites are unix-only (vllm-wrapper uses
      # syscall.Kill), so they run here (Linux) and not in the Windows
      # CI, which only runs make test-all (internal).
      - name: Test cmd utilities
        run: make test-cmd

      # Lint + render the kubeswap Helm chart (helm ships on the runner;
      # the fallback keeps the step working if a future image drops it).
      - name: Test chart
        run: |
          if ! command -v helm >/dev/null; then
            helm_tgz="$(mktemp)"
            curl -fsSL --max-time 300 --retry 3 -o "$helm_tgz" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
            sudo tar xzf "$helm_tgz" --strip-components=1 -C /usr/local/bin
            rm -f "$helm_tgz"
          fi
          make test-chart

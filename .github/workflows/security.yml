---
name: Security Scan

'on':
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
  # Runs on draft pull requests too: a scanner that cannot load the code
  # must fail before the change reaches main, not after. The paths filter
  # covers every input of the scan; it also keeps the job out of the
  # required checks that the ruleset derives from unfiltered triggers.
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.gosec.json'
      - '.github/tools/**'
      - '.github/workflows/security.yml'

jobs:
  vulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          # See ci.yml: setup-go's cache key carries no job name, so every job
          # in the repository would share one build cache entry.
          cache: false

      # A cache key joins the runner, the go.sum hash and, for the build cache,
      # the commit, and runs past 80 columns, so yamllint's line-length rule is
      # off for the two cache steps alone.
      # yamllint disable rule:line-length
      - name: Restore Go module cache
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      # `vulncheck` names this job's build cache and must differ from every
      # other job's.
      - name: Restore Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-
      # yamllint enable rule:line-length

      # Versions are pinned in .github/tools/go.mod. gosec v2.29.0 requires
      # golang.org/x/tools v0.49.0, which cannot read the export data that
      # Go 1.27 writes (pkgbits V5); the tools module raises x/tools to a
      # version that can, so gosec type-checks every package.
      - name: Install Tools
        run: go -C .github/tools install tool
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Run gosec
        run: gosec -conf .gosec.json ./...

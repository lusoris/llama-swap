name: Validate Renovate config

on:
  pull_request:
    paths:
      - "renovate.json"
      - "docker/unified/build-image.sh"
      - "docker/unified/*.Dockerfile"
      - "renovate_config_test.go"
      - ".github/workflows/renovate-config.yml"
  push:
    branches:
      - main
    paths:
      - "renovate.json"
      - "docker/unified/build-image.sh"
      - "docker/unified/*.Dockerfile"
      - "renovate_config_test.go"
      - ".github/workflows/renovate-config.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/renovatebot/renovate:44.200.0@sha256:8639eca545119147ce9114c22315129dd52794b3ea8a6767f8b0bd22606545c4
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate Renovate configuration
        run: renovate-config-validator --strict renovate.json

  manager-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # See ci.yml: explicit restores keep other refs from saving.
          cache: false

      # Runner and input hashes make cache keys exceed 80 columns.
      # yamllint disable rule:line-length
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-
      # yamllint enable rule:line-length

      - name: Run Renovate CUDA manager tests
        run: go test . -run 'TestRenovate|TestUnifiedDocker' -count=1 -v
